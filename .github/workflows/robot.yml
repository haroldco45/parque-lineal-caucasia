name: Robot de noticias y SECOP

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: robot
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Buscar noticias y estado del contrato
        run: node robot/actualizar.mjs
      - name: Guardar si hubo cambios
        run: |
          git config user.name "robot-ojo-al-parque"
          git config user.email "robot@users.noreply.github.com"
          git add data/noticias.json data/secop.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Robot: noticias y SECOP $(TZ=America/Bogota date '+%Y-%m-%d %H:%M')"
            git push
          fi
